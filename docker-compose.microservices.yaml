services:
  # 新增 Grafana LGTM 监控服务
  grafana:
    image: grafana/otel-lgtm:latest
    container_name: lgtm
    ports:
      - "${GRAFANA_PORT:-3001}:3000"   # Grafana UI（避免与frontend冲突）
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
    networks:
      - openwebui-network
    restart: unless-stopped


  # Frontend Service - Nginx serving static files
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: openwebui-frontend:latest
    container_name: open-webui-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - openwebui-network
    restart: unless-stopped
    
  # Backend Service - Python API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        OLLAMA_BASE_URL: '/ollama'
    image: openwebui-backend:latest
    container_name: open-webui-backend
    volumes:
      - open-webui-backend:/app/backend/data
    depends_on:
      - ollama
      - redis
      - grafana
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
      - 'ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}'
      - 'ENABLE_PERSISTENT_CONFIG=${ENABLE_PERSISTENT_CONFIG:-false}'
      - 'REDIS_URL=${REDIS_URL:-}'
      - 'DATABASE_URL=${DATABASE_URL:-}'
      #enable ComfyUI
      - 'ENABLE_IMAGE_GENERATION=True'
      - 'COMFYUI_BASE_URL=http://comfyui:8188'
      # OpenTelemetry 配置
      - 'ENABLE_OTEL=true'
      - 'ENABLE_OTEL_METRICS=true'
      - 'OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana:4317'
      - 'OTEL_EXPORTER_OTLP_INSECURE=true'
      - 'OTEL_SERVICE_NAME=cerebra-ui'
      - 'OTEL_BASIC_AUTH_USERNAME=admin'
      - 'OTEL_BASIC_AUTH_PASSWORD=admin'
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - openwebui-network  
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  #support MCP
  mcpo-server:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo-server
    restart: unless-stopped
    ports:
      # 将 8000 端口暴露出来，主要是为了方便从浏览器访问 API 文档进行调试
      - "8000:8000"
    volumes:
      # 将宿主机的配置文件挂载到容器中，:ro 表示只读
      - ./mcp-config.json:/app/config.json:ro
    command: >
      mcpo 
      --host 0.0.0.0 
      --port 8000 
      --config /app/config.json 
      --api-key="your-secret-api-key"
    networks:
      - openwebui-network

  # ComfyUI Service - Image Generation
  comfyui:
    platform: linux/amd64
    init: true
    container_name: comfyui
    image: "yanwk/comfyui-boot:cu126-slim"
    ports:
      - "8188:8188"
    volumes:
      - "./comfyui/storage:/root"
      - "./comfyui/storage-models/models:/root/ComfyUI/models"
      - "./comfyui/storage-models/hf-hub:/root/.cache/huggingface/hub"
      - "./comfyui/storage-models/torch-hub:/root/.cache/torch/hub"
      - "./comfyui/storage-user/input:/root/ComfyUI/input"
      - "./comfyui/storage-user/output:/root/ComfyUI/output"
      - "./comfyui/storage-user/workflows:/root/ComfyUI/user/default/workflows"
    environment:
      - CLI_ARGS=--cpu
    restart: unless-stopped
    networks:
      - openwebui-network

  # Langflow Service - AI Workflow Builder
  langflow:
    image: langflowai/langflow:latest
    pull_policy: always
    container_name: langflow
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_DATABASE_URL=${LANGFLOW_DATABASE_URL}
      - LANGFLOW_CONFIG_DIR=app/langflow
    volumes:
      - langflow-data:/app/langflow
    networks:
      - openwebui-network

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: openwebui-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --save 60 1000
    restart: unless-stopped
    networks:
      - openwebui-network  
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Model Service - Ollama
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    networks:
      - openwebui-network

networks:
  openwebui-network:
    driver: bridge

volumes:
  ollama: {}
  open-webui-backend: {}
  redis-data: {}
  langflow-data: {}