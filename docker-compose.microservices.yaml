services:
  # Crawl4AI
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    ports:
      - "11235:11235"
    shm_size: 1g
    networks:
      - cerebraui-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Grafana LGTM
  grafana:
    image: grafana/otel-lgtm:latest
    container_name: lgtm
    ports:
      - "${GRAFANA_PORT:-3001}:3000"   # Grafana UI
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
    networks:
      - cerebraui-network
    restart: unless-stopped

  # Frontend Service - Nginx serving static files
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: cerebraui-frontend:latest
    container_name: cerebraui-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - cerebraui-network
    restart: unless-stopped
    
  # Backend Service - Python API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        OLLAMA_BASE_URL: '/ollama'
    image: cerebraui-backend:latest
    container_name: cerebraui-backend
    volumes:
      - cerebraui-backend:/app/backend/data
    depends_on:
      - ollama
      - redis
      - grafana
      - crawl4ai
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
      - 'ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}'
      - 'ENABLE_PERSISTENT_CONFIG=${ENABLE_PERSISTENT_CONFIG:-false}'
      - 'REDIS_URL=${REDIS_URL:-}'
      - 'DATABASE_URL=${DATABASE_URL:-}'
      # ComfyUI
      - 'ENABLE_IMAGE_GENERATION=True'
      - 'COMFYUI_BASE_URL=http://comfyui:8188'
      # OpenTelemetry
      - 'ENABLE_OTEL=true'
      - 'ENABLE_OTEL_METRICS=true'
      - 'OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana:4317'
      - 'OTEL_EXPORTER_OTLP_INSECURE=true'
      - 'OTEL_SERVICE_NAME=cerebraui'
      - 'OTEL_BASIC_AUTH_USERNAME=admin'
      - 'OTEL_BASIC_AUTH_PASSWORD=admin'
      # Web Search
      - 'ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-false}'
      - 'WEB_SEARCH_RESULT_COUNT=${WEB_SEARCH_RESULT_COUNT:-2}'
      - 'ENABLE_SEARCH_QUERY_GENERATION=${ENABLE_SEARCH_QUERY_GENERATION:-true}'
      - 'WEB_SEARCH_ENGINE=${WEB_SEARCH_ENGINE:-duckduckgo}'
      - 'WEB_LOADER_CONCURRENT_REQUESTS=${WEB_LOADER_CONCURRENT_REQUESTS:-6}'
      - 'WEB_SEARCH_TRUST_ENV=${WEB_SEARCH_TRUST_ENV:-false}'
      - 'BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL=${BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL:-false}'
      - 'WEB_LOADER_ENGINE=${WEB_LOADER_ENGINE:-safe_web}'
      - 'TAVILY_API_KEY=${TAVILY_API_KEY:-}'
      - 'ANONYMIZED_TELEMETRY=${ANONYMIZED_TELEMETRY:-false}'
      - 'RESEND_API_KEY=${RESEND_API_KEY:-}'
      - 'CF_TURNSTILE_SECRET=${CF_TURNSTILE_SECRET:-}'
      - 'ENABLE_DEEP_RESEARCH=${ENABLE_DEEP_RESEARCH:-false}'
      - 'DEEP_RESEARCH_BASE_URL=${DEEP_RESEARCH_BASE_URL:-}'
      - 'DEEP_RESEARCH_API_KEY=${DEEP_RESEARCH_API_KEY:-}'
      - 'DEEP_RESEARCH_WORKFLOW_ID=${DEEP_RESEARCH_WORKFLOW_ID:-}'

    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - cerebraui-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  #support MCP
  mcpo-server:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./mcp-config.json:/app/config.json:ro
    command: >
      mcpo 
      --host 0.0.0.0 
      --port 8000 
      --config /app/config.json 
      --api-key="your-secret-api-key"
    networks:
      - cerebraui-network

  # ComfyUI Service - Image Generation
  comfyui:
    platform: linux/amd64
    init: true
    container_name: comfyui
    image: "yanwk/comfyui-boot:cu126-slim"
    ports:
      - "8188:8188"
    volumes:
      - "./comfyui/storage:/root"
      - "./comfyui/storage-models/models:/root/ComfyUI/models"
      - "./comfyui/storage-models/hf-hub:/root/.cache/huggingface/hub"
      - "./comfyui/storage-models/torch-hub:/root/.cache/torch/hub"
      - "./comfyui/storage-user/input:/root/ComfyUI/input"
      - "./comfyui/storage-user/output:/root/ComfyUI/output"
      - "./comfyui/storage-user/workflows:/root/ComfyUI/user/default/workflows"
      - "./comfyui/user-scripts:/root/user-scripts"
    environment:
      - CLI_ARGS=--cpu
      - FAL_API_KEY=${FAL_API_KEY}
    restart: unless-stopped
    networks:
      - cerebraui-network

  # Langflow Service - AI Workflow Builder
  langflow:
    image: langflowai/langflow:latest
    pull_policy: always
    container_name: langflow
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_DATABASE_URL=${LANGFLOW_DATABASE_URL}
      - LANGFLOW_CONFIG_DIR=app/langflow
    volumes:
      - langflow-data:/app/langflow
    networks:
      - cerebraui-network

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: cerebraui-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --save 60 1000
    restart: unless-stopped
    networks:
      - cerebraui-network  
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Model Service - Ollama
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    ports:
      - "11434:11434"
    networks:
      - cerebraui-network

networks:
  cerebraui-network:
    driver: bridge

volumes:
  ollama: {}
  cerebraui-backend: {}
  redis-data: {}
  langflow-data: {}