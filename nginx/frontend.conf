server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=86400";
    }

    # ⭐ DeepResearch SSE 反代（关键：关闭缓冲）
    location /ai/deepresearch/ {
        proxy_pass         http://cerebraui-backend:8080/ai/deepresearch/;
        proxy_http_version 1.1;
        proxy_buffering    off;
        gzip               off;
        add_header         X-Accel-Buffering no;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API
    location /api/ {
        proxy_pass http://cerebraui-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /docs         { proxy_pass http://cerebraui-backend:8080/docs; }
    location /openapi.json { proxy_pass http://cerebraui-backend:8080/openapi.json; }
    location /static/      { proxy_pass http://cerebraui-backend:8080/static/; }

    # WS
    location /ws/ {
        proxy_pass http://cerebraui-backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # OpenAI 透传（保持你原来的）
    location /openai/config { proxy_pass http://cerebraui-backend:8080/openai/config; }
    location = /openai/verify { proxy_pass http://cerebraui-backend:8080/openai/verify; proxy_http_version 1.1; }
    location /openai/ {
        proxy_pass http://cerebraui-backend:8080/openai/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ollama（保持你原来的）
    location = /ollama/verify { proxy_pass http://ollama:11434/api/version; proxy_method GET; }
    location = /ollama/config  { proxy_pass http://cerebraui-backend:8080/ollama/config; }
    location = /ollama/api/tags/0 { proxy_pass http://ollama:11434/api/tags; }
    location = /ollama/api/pull/0 {
        proxy_pass http://ollama:11434/api/pull;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ollama/ {
        proxy_pass http://ollama:11434/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    location = /favicon.ico { access_log off; log_not_found off; }
}

